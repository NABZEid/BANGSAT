name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK universal
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk APK-Builder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: APK-Builder
          path: APK-Builder.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK Builder v${{ github.run_number }}
          files: APK-Builder.apk
